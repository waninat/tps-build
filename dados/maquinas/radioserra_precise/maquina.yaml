# Elekta Precise — Radioserra, Petrópolis (RJ)
# Valores marcados CONFIRMAR devem ser confirmados pela física antes de qualquer uso clínico.
id: radioserra_precise
vendor: Elekta
model: Precise
serial: CONFIRMAR
dicom_machine_names: ["Precise"]     # TreatmentMachineName no Mosaiq/Monaco (visto no RTPLAN do Monaco, 22/11/2026)
sad_mm: 1000.0
energies_mv: [6]                     # CONFIRMAR outras energias de fótons (e elétrons)
fff: false
techniques: ["2D", "3D", "STEP&SHOOT", "VMAT"]   # IMRT e VMAT licenciados (informado em 24/11/2026)
collimation:
  jaw_x: {present: true, dicom_types: ["ASYMX", "X"]}    # diafragma de reserva, sob as lâminas
  jaw_y: {present: true, dicom_types: ["ASYMY", "Y"]}
  mlc:
    dicom_type: MLCX
    preset: mlci
    leaf_pairs: 40
    leaf_width_mm: 10.0
    widths: [[40, 10.0]]
    max_overtravel_mm: 125.0          # CONFIRMAR
    min_gap_mm: 5.0                   # CONFIRMAR (gap mínimo entre A e B, e entre vizinhos opostos)
    interdigitation: false            # MLCi: a lâmina A não pode passar a B dos pares vizinhos
    max_bank_span_mm: null            # CONFIRMAR, se houver limite de extensão do banco
dicom_exportacao:                     # como o Monaco 6.1 grava para o Mosaiq (RTPLAN de referência, 22/11/2026)
  distancia_fonte_mm: {ASYMX: 426.0, ASYMY: 509.0, MLCX: 377.0}   # SourceToBeamLimitingDeviceDistance
  tolerancia: "1 Fótons"              # ToleranceTableLabel
  departamento: "0~RadioSerra"        # InstitutionalDepartmentName nos feixes
  segmentos: step_and_shoot           # campo dentro do campo num único feixe STATIC (como o Monaco)
vmat:                                 # limites usados na otimização e na estimativa do tempo de entrega — CONFIRMAR
  gantry_vel_max_graus_s: 6.0         # Elekta: 1 volta/min
  lamina_vel_max_mm_s: 20.0           # MLCi (no isocentro)
  taxa_dose_max_um_min: 500.0         # taxa máxima do 6 MV (VMAT: a Elekta modula em faixas discretas)
  um_por_grau_min: 0.1
  um_por_grau_max: 20.0
  deslocamento_max_mm_grau: 4.0       # percurso da lâmina por grau na otimização (≈ v_lâmina ÷ v_gantry ≈ 3,3)
  espacamento_cp_graus: 4.0           # entre pontos de controle
  max_pontos_arco: 360                # limite de pontos de controle por arco no Mosaiq/Integrity — CONFIRMAR
cunha_motorizada: null                # fora do escopo: o serviço não usa cunha (field-in-field automático)
dados_de_feixe:
  "6MV":
    origem: "RXT Dosimetria, nov/2019 (PDD 3–40, TMR, FAC = Scp medido, NPSF de Li 1999, OCR × profundidade 40×40)"
    calibracao_cGy_por_UM: 1.000      # @ dmax 1,5 cm, 10×10, SSD 100 (relatório RXT, nov/2019)
    qualidade: {D20_D10: 0.589, TPR20_10: 0.685}
