name: testes
on:
  push:
    branches: [main]
  pull_request:
jobs:
  testes:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q --junitxml=relatorio-testes.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-testes-${{ matrix.os }}-${{ matrix.python }}
          path: relatorio-testes.xml
